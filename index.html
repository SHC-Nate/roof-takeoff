<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SHC Roof Take-off</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12233b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHC Take-off">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --navy:#12233b; --navy-2:#1c3352; --steel:#3d5674; --line:#d3dae3;
    --paper:#eef1f5; --card:#ffffff; --ink:#12233b; --muted:#5f7189;
    --orange:#e4650d; --orange-soft:#fbe7d5; --wet:#2f78c9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--paper);display:flex;flex-direction:column;height:100dvh}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{background:var(--navy);color:#fff;flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:8px 14px;box-shadow:0 1px 0 rgba(0,0,0,.15);z-index:30}
  .brand{display:flex;align-items:baseline;gap:8px;font-weight:800;letter-spacing:.02em}
  .brand .sq{width:12px;height:12px;background:var(--orange);display:inline-block;border-radius:2px;transform:translateY(1px)}
  .brand small{font-weight:600;color:#9fb0c6;letter-spacing:.14em;text-transform:uppercase;font-size:10px}
  .job{display:flex;gap:8px;align-items:center;flex:1;min-width:0;flex-wrap:wrap}
  .job input{background:var(--navy-2);border:1px solid #2b476b;color:#fff;border-radius:6px;padding:6px 8px;font-size:12.5px;min-width:0}
  .job input#job{flex:1 1 180px;min-width:110px}
  .job input::placeholder{color:#7f93ad}
  .top-actions{display:flex;gap:6px;flex:0 0 auto}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;
    padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:var(--steel)}
  .btn.dark{background:var(--navy-2);color:#fff;border-color:#2b476b}
  .btn.orange{background:var(--orange);color:#fff;border-color:var(--orange)}
  .btn:active{transform:translateY(1px)}
  main{flex:1;display:flex;min-height:0;position:relative}
  #palette{flex:0 0 180px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;
    padding:10px;display:flex;flex-direction:column;gap:6px;z-index:20}
  .p-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 2px 2px}
  .tool{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;border:1px solid transparent;
    cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);background:#f6f8fb}
  .tool:hover{background:#eef2f7}
  .tool.active{border-color:var(--dot,var(--orange));background:var(--card);box-shadow:0 0 0 2px var(--dot,var(--orange)) inset}
  .chip{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.02em}
  .chip.line{border-radius:3px;height:6px;width:22px}
  .chip.area{border-radius:4px;height:16px;width:22px;border:1.5px solid var(--wet);background:rgba(47,120,201,.30)}
  #stage{flex:1;position:relative;overflow:hidden;background:#dfe4ea;touch-action:none}
  #canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;color:var(--muted)}
  .empty h2{margin:0;color:var(--navy);font-size:17px}
  .empty p{margin:0;max-width:360px;font-size:13px;line-height:1.5}
  .drawbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:8px;z-index:16}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:0 2px 10px rgba(18,35,59,.12)}
  .seg button{border:none;background:transparent;padding:8px 16px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--orange);color:#fff}
  .pathctrl{display:inline-flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 2px 10px rgba(18,35,59,.12)}
  .pathctrl button{border:none;background:#f2f5f9;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer}
  .pathctrl button#finishPath{background:var(--orange);color:#fff}
  .zoombar{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;background:var(--card);
    border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 2px 10px rgba(18,35,59,.12)}
  .zoombar button{border:none;background:transparent;width:34px;height:32px;border-radius:6px;font-size:16px;font-weight:700;color:var(--navy);cursor:pointer}
  .zoombar button:hover{background:#eef2f7}
  .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--navy);color:#fff;
    font-size:12px;font-weight:600;padding:7px 13px;border-radius:20px;box-shadow:0 3px 12px rgba(18,35,59,.25);
    pointer-events:none;opacity:0;transition:opacity .18s;white-space:nowrap;z-index:15}
  .hint.show{opacity:1}
  #summary{flex:0 0 274px;background:var(--card);border-left:1px solid var(--line);overflow-y:auto;padding:14px;z-index:20}
  #summary h3{margin:0 0 2px;font-size:13px;letter-spacing:.02em}
  #summary .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .grp{margin-bottom:14px}
  .grp-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);margin-bottom:5px}
  .grp-h .n{margin-left:auto;background:var(--paper);border-radius:20px;padding:1px 8px;font-size:11px}
  .row{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:5px 6px;border-radius:6px;cursor:pointer}
  .row:hover{background:#f4f7fb}
  .row .tag{flex:0 0 auto;font-weight:800;font-size:10px;color:#fff;border-radius:4px;padding:2px 5px;min-width:26px;text-align:center}
  .row .desc{flex:1;color:var(--ink);line-height:1.35}
  .row .desc em{color:var(--muted);font-style:normal}
  .totals{border-top:1px dashed var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
  .totals b{color:var(--navy)}
  .aerial{margin-top:10px;background:#fdece9;border:1px solid #f3c9c4;color:#8a2b22;
    border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.4;font-weight:600}
  .none{font-size:12px;color:var(--muted);font-style:italic;padding:2px}
  #editor{position:absolute;right:0;top:0;height:100%;width:308px;max-width:88vw;background:var(--card);
    border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(18,35,59,.14);transform:translateX(105%);
    transition:transform .2s ease;z-index:40;display:flex;flex-direction:column}
  #editor.open{transform:none}
  .ed-head{background:var(--navy);color:#fff;padding:13px 14px;display:flex;align-items:center;gap:10px}
  .ed-head .chip{width:26px;height:26px}
  .ed-head .t{font-weight:800;font-size:14px}
  .ed-head .x{margin-left:auto;background:transparent;border:none;color:#c7d3e2;font-size:20px;cursor:pointer;line-height:1}
  .ed-body{padding:14px;overflow-y:auto;flex:1}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;
    font-size:14px;font-family:inherit;color:var(--ink);background:#fbfcfe}
  .fld textarea{min-height:52px;resize:vertical}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--orange);background:#fff}
  .fld.check{display:flex;align-items:center;gap:10px}
  .fld.check input{width:18px;height:18px;flex:0 0 auto}
  .fld.check label{margin:0;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink)}
  .computed{background:var(--orange-soft);border:1px solid #f2d3ba;border-radius:7px;padding:9px 10px;font-size:14px;font-weight:800;color:#a8480a}
  .dbl{display:flex;gap:8px}
  .dbl .fld{flex:1}
  .ed-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
  .ed-foot .btn{flex:1;justify-content:center}
  .btn.danger{color:#b3261e;border-color:#f0c9c6}
  .btn.danger:hover{background:#fdecea}
  .flag{color:#b3261e;font-weight:700}
  .mtoggle{display:none}
  @media (max-width:820px){
    #summary{position:absolute;right:0;top:0;height:100%;transform:translateX(105%);transition:transform .2s;box-shadow:-8px 0 24px rgba(18,35,59,.14)}
    #summary.open{transform:none}
    #palette{flex-basis:154px}
    .mtoggle{display:inline-flex}
    .brand small{display:none}
  }
  @media (max-width:560px){
    main{flex-direction:column}
    #palette{flex:0 0 auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--line);gap:6px}
    #palette .p-eyebrow{display:none}
    .tool{flex-direction:column;gap:4px;min-width:66px;text-align:center;font-size:10px;padding:7px 5px}
    .tool .chip{width:24px;height:24px}
    .job input#insp,.job input#date{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="sq"></span>SHC <small>Roof Take-off</small></div>
  <div class="job">
    <input id="job" placeholder="Job name / address">
    <input id="opp" placeholder="Opportunity #" style="flex:0 0 128px">
    <input id="insp" placeholder="Inspector" style="flex:0 0 104px">
    <input id="date" type="date" style="flex:0 0 138px">
  </div>
  <div class="top-actions">
    <button class="btn mtoggle" id="mSummary" title="Take-off summary">☰</button>
    <button class="btn" id="loadBtn">Open</button>
    <button class="btn dark" id="saveBtn">Save</button>
    <button class="btn orange" id="exportBtn">Export</button>
  </div>
</header>

<main>
  <nav id="palette"></nav>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div class="empty" id="empty">
      <h2>Start a take-off</h2>
      <p>Drop in an aerial of the roof — a Google Earth screenshot, a drone shot, anything. Then tap the roof to place drains, penetrations, curbs and walls right where they are.</p>
      <button class="btn orange" id="addImg">Load roof image</button>
      <p style="font-size:12px">Already started one? <a href="#" id="openHere" style="color:var(--orange);font-weight:600">Open a saved take-off</a></p>
    </div>
    <div class="drawbar" id="drawbar" hidden>
      <div class="seg" id="modeSeg">
        <button data-mode="line" class="on">Line</button>
        <button data-mode="path">Path</button>
      </div>
      <div class="pathctrl" id="pathctrl" hidden>
        <button id="undoPt">Undo point</button>
        <button id="finishPath">Finish</button>
        <button id="cancelPath">Cancel</button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="zoombar">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zfit" title="Fit" style="font-size:12px;font-weight:700">FIT</button>
    </div>
  </div>

  <aside id="summary"></aside>
</main>

<div id="editor">
  <div class="ed-head"><span class="chip" id="edChip"></span><span class="t" id="edTitle"></span><button class="x" id="edClose">×</button></div>
  <div class="ed-body" id="edBody"></div>
  <div class="ed-foot">
    <button class="btn danger" id="edDelete">Delete</button>
    <button class="btn orange" id="edDone" style="flex:2">Done</button>
  </div>
</div>

<input type="file" id="imgInput" accept="image/*" hidden>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
"use strict";

/* ---------- helpers ---------- */
function numOf(s){ const m=String(s==null?"":s).match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function unitOf(s){ const m=String(s==null?"":s).match(/[a-zA-Z"']+\s*$/); return m?m[0].trim():""; }
function avgStr(a,b){ const x=numOf(a),y=numOf(b); if(x==null||y==null) return "—";
  const u=unitOf(a)||unitOf(b)||""; return (Math.round(((x+y)/2)*10)/10)+(u?" "+u:""); }
function variancePct(f,g){ const a=numOf(f),b=numOf(g); if(a==null||b==null||b===0) return null; return Math.abs(a-b)/Math.abs(b)*100; }
function varianceStr(f,g){ const p=variancePct(f,g); return p==null?"—":(Math.round(p*10)/10)+"%"; }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function round1(x){return Math.round(x*10)/10;}
const VAR_THRESHOLD = 3;

/* parse a field measurement to feet: supports 42'  36"  12' 6"  30 ft  bare number(=ft) */
function parseLenFeet(str){
  if(str==null) return null; const s=String(str).trim(); if(!s) return null;
  let feet=0, matched=false;
  const fm=s.match(/(-?\d+(?:\.\d+)?)\s*(?:'|ft|feet)/i);
  const im=s.match(/(\d+(?:\.\d+)?)\s*(?:"|in|inch|inches)/i);
  if(fm){ feet+=parseFloat(fm[1]); matched=true; }
  if(im){ feet+=parseFloat(im[1])/12; matched=true; }
  if(!matched){ const n=parseFloat(s); if(!isNaN(n)){ feet=n; matched=true; } }
  return matched?feet:null;
}

/* ---------- component library ---------- */
const TYPES = {
  RD:{code:"RD", name:"Roof Drain", color:"#2f6fb3", fields:[
    {k:"size", label:"Drain size", type:"select", opts:["2\"","3\"","4\"","6\"","8\"","Other"], def:"4\"", controls:true},
    {k:"sizeOther", label:"Specify size", type:"text", ph:"e.g. 5\"", when:a=>a.size==="Other"},
    {k:"kind", label:"Type", type:"select", opts:["Primary","Overflow"], def:"Primary"},
    {k:"note", label:"Note", type:"textarea"} ]},
  SC:{code:"SC", name:"Scupper", color:"#178a8a", fields:[
    {k:"w", label:"Width", type:"text", ph:"in"},{k:"h", label:"Height", type:"text", ph:"in"},
    {k:"kind", label:"Type", type:"select", opts:["Through-wall","Overflow"], def:"Through-wall"},
    {k:"note", label:"Note", type:"textarea"} ]},
  PB:{code:"PB", name:"Preformed Pipe Boot", color:"#2f8f4e", fields:[
    {k:"dia", label:"Pipe diameter", type:"select", opts:["1\"","1.5\"","2\"","3\"","4\"","6\"","Other"], def:"2\""},
    {k:"note", label:"Note", type:"textarea"} ]},
  SB:{code:"SB", name:"Split Pipe Boot", color:"#7a8a1f", fields:[
    {k:"dia", label:"Pipe diameter", type:"select", opts:["1\"","1.5\"","2\"","3\"","4\"","6\"","Other"], def:"3\""},
    {k:"reason", label:"Reason for split", type:"text", ph:"e.g. gas line, no term"},
    {k:"note", label:"Note", type:"textarea"} ]},
  CB:{code:"CB", name:"Equipment Curb", color:"#7a4fb0", fields:[
    {k:"l", label:"Length", type:"text", ph:"in"},{k:"w", label:"Width", type:"text", ph:"in"},
    {k:"ht", label:"Curb height", type:"text", ph:"in"},
    {k:"equip", label:"Equipment", type:"select", opts:["RTU","Exhaust fan","Make-up air","AC unit","Skylight curb","Other"], def:"RTU"},
    {k:"note", label:"Note", type:"textarea"} ]},
  PP:{code:"PP", name:"Pitch Pan / Pocket", color:"#cf8a17", fields:[
    {k:"pens", label:"# penetrations in pan", type:"text", ph:"count"},
    {k:"size", label:"Pan size", type:"text", ph:"e.g. 8x8"},
    {k:"note", label:"Note", type:"textarea"} ]},
  SK:{code:"SK", name:"Skylight", color:"#1f9bb0", fields:[
    {k:"l", label:"Length", type:"text", ph:"in"},{k:"w", label:"Width", type:"text", ph:"in"},
    {k:"note", label:"Note", type:"textarea"} ]},
  RH:{code:"RH", name:"Roof Hatch", color:"#556070", fields:[
    {k:"size", label:"Size", type:"text", ph:"e.g. 30x36"},
    {k:"note", label:"Note", type:"textarea"} ]},
  VO:{code:"VO", name:"Vent / Other", color:"#9a6b4f", fields:[
    {k:"desc", label:"What is it?", type:"text", ph:"e.g. B-vent, conduit"},
    {k:"note", label:"Note", type:"textarea"} ]},

  W:{code:"W", name:"Wall / Edge", isLine:true, fields:[
    {k:"runtype", label:"This run is", type:"select", opts:["Parapet wall","Roof edge"], def:"Parapet wall", controls:true},
    {k:"tapered", label:"Tapered height (changes end to end)", type:"checkbox", controls:true, when:a=>a.runtype!=="Roof edge"},
    {k:"ht", label:"Wall height", type:"text", ph:"e.g. 36 in", when:a=>a.runtype!=="Roof edge" && !a.tapered},
    {k:"ht1", label:"Height at start", type:"text", ph:"in", when:a=>a.runtype!=="Roof edge" && a.tapered},
    {k:"ht2", label:"Height at end", type:"text", ph:"in", when:a=>a.runtype!=="Roof edge" && a.tapered},
    {k:"htavg", label:"Average height", type:"computed", when:a=>a.runtype!=="Roof edge" && a.tapered, compute:a=>avgStr(a.ht1,a.ht2)},
    {k:"width", label:"Wall width (top / membrane wrap)", type:"text", ph:"in", when:a=>a.runtype!=="Roof edge"},
    {k:"cap", label:"Parapet cap type", type:"select", opts:["Metal","Masonry","Clay","Copper"], def:"Metal", controls:true, when:a=>a.runtype!=="Roof edge"},
    {k:"capWidth", label:"Existing cap width", type:"text", ph:"in", when:a=>a.runtype!=="Roof edge" && (a.cap==="Metal"||a.cap==="Copper")},
    {k:"capFace", label:"Existing cap face / leg", type:"text", ph:"in", when:a=>a.runtype!=="Roof edge" && (a.cap==="Metal"||a.cap==="Copper")},
    {k:"edge", label:"Existing drip edge type", type:"select", opts:["Drip edge","Gravel stop","Fascia metal","Edge metal / cleat","None","Other"], def:"Drip edge", when:a=>a.runtype==="Roof edge"},
    {k:"edgeFace", label:"Drip edge face / leg", type:"text", ph:"in", when:a=>a.runtype==="Roof edge"},
    {k:"len", label:"Measured length (from field checks)", type:"computed", compute:(a,it)=>fmtLen(it)},
    {k:"note", label:"Note", type:"textarea"} ]},

  MA:{code:"MA", name:"Moisture Area", color:"#2f78c9", isArea:true, fields:[
    {k:"status", label:"Status", type:"select", opts:["Confirmed wet","Suspected"], def:"Confirmed wet"},
    {k:"method", label:"Survey method", type:"select", opts:["Infrared","Capacitance meter","Nuclear","Core cut","Visual / ponding"], def:"Infrared"},
    {k:"area", label:"Measured area (from field checks)", type:"computed", compute:(a,it)=>fmtArea(it)},
    {k:"note", label:"Note", type:"textarea"} ]},

  FC:{code:"FC", name:"Field Check", color:"#d23b3b", isLine:true, isMeasure:true, fields:[
    {k:"where", label:"What you measured", type:"text", ph:"e.g. N parapet, RTU width"},
    {k:"field", label:"Field measurement", type:"text", ph:"e.g. 42' or 36\""},
    {k:"ge", label:"Google Earth measurement", type:"text", ph:"e.g. 40'"},
    {k:"variance", label:"Variance vs Google Earth", type:"computed", compute:a=>varianceStr(a.field,a.ge)},
    {k:"note", label:"Note", type:"textarea"} ]},
};
const ORDER = ["RD","SC","PB","SB","CB","PP","SK","RH","VO"];
const PAIRS = [["w","h"],["l","w"],["ht1","ht2"],["capWidth","capFace"]];
function isPair(a,b){ return PAIRS.some(p=>p[0]===a&&p[1]===b); }
function itemColor(it){
  if(it.kind==="W") return it.attrs.runtype==="Roof edge" ? "#4a6785" : "#e4650d";
  if(it.kind==="FC") return "#d23b3b";
  if(it.kind==="MA") return "#2f78c9";
  return TYPES[it.kind].color;
}

/* ---------- scale from field checks ---------- */
function computeScale(){
  const fcs=state.items.filter(i=>i.kind==="FC");
  const hx=[], vy=[], iso=[];
  fcs.forEach(it=>{
    const feet=parseLenFeet(it.attrs.field); if(feet==null||!it.pts) return;
    const dx=Math.abs(it.pts[1].x-it.pts[0].x), dy=Math.abs(it.pts[1].y-it.pts[0].y);
    const len=Math.hypot(dx,dy); if(len<1) return;
    iso.push(feet/len);
    if(dx>3*dy) hx.push(feet/dx);
    else if(dy>3*dx) vy.push(feet/dy);
  });
  if(!iso.length) return null;
  const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
  let sx=hx.length?avg(hx):null, sy=vy.length?avg(vy):null;
  const isoAvg=avg(iso);
  if(sx==null&&sy==null){ sx=sy=isoAvg; }
  else if(sx==null){ sx=sy; } else if(sy==null){ sy=sx; }
  return {sx,sy,count:iso.length};
}
function lenFtOf(it){
  const sc=computeScale(); if(!sc||!it.pts||it.pts.length<2) return null;
  let L=0; for(let i=0;i<it.pts.length-1;i++){
    const dx=it.pts[i+1].x-it.pts[i].x, dy=it.pts[i+1].y-it.pts[i].y;
    L+=Math.hypot(dx*sc.sx, dy*sc.sy); } return L;
}
function shoelace(pts){ let a=0; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ a+=(pts[j].x+pts[i].x)*(pts[j].y-pts[i].y); } return Math.abs(a/2); }
function areaFtOf(it){ const sc=computeScale(); if(!sc||!it.pts||it.pts.length<3) return null; return shoelace(it.pts)*sc.sx*sc.sy; }
function fmtLen(it){ const L=lenFtOf(it); return L==null?"Add a field check to auto-measure":round1(L)+" ft"; }
function fmtArea(it){ const A=areaFtOf(it); return A==null?"Add a field check to auto-measure":`${Math.round(A).toLocaleString()} sq ft  ·  ${(A/100).toFixed(1)} squares`; }

/* ---------- state ---------- */
let state = { img:null, imgW:0, imgH:0, imgData:null, items:[] };
let view = { scale:1, tx:0, ty:0 };
let tool="select", wallMode="line", selectedId=null, lineStart=null;
let draft={pts:[]}, draftKind=null, seq=1;

const stage=document.getElementById("stage"), canvas=document.getElementById("canvas"), ctx=canvas.getContext("2d");
const hintEl=document.getElementById("hint"), editor=document.getElementById("editor");
const drawbar=document.getElementById("drawbar"), pathctrl=document.getElementById("pathctrl"), modeSeg=document.getElementById("modeSeg");

/* ---------- palette ---------- */
function buildPalette(){
  const nav=document.getElementById("palette"); nav.innerHTML="";
  const eb=t=>{const d=document.createElement("div");d.className="p-eyebrow";d.textContent=t;return d;};
  const mk=(label,code,dot,chipClass)=>{
    const el=document.createElement("div");
    el.className="tool"+(tool===code?" active":""); el.style.setProperty("--dot",dot); el.dataset.tool=code;
    const chip=`<span class="chip ${chipClass||""}" style="${chipClass==="area"?"":"background:"+dot}">${chipClass?"":(TYPES[code]?TYPES[code].code:"")}</span>`;
    el.innerHTML=chip+`<span class="lbl-txt">${label}</span>`; el.onclick=()=>setTool(code); return el;
  };
  nav.appendChild(eb("Tools"));
  nav.appendChild(mk("Select / move","select","#3d5674","line"));
  nav.appendChild(eb("Walls & edges"));
  nav.appendChild(mk("Wall / edge","W","#e4650d","line"));
  nav.appendChild(mk("Field check (verify)","FC","#d23b3b","line"));
  nav.appendChild(eb("Conditions"));
  nav.appendChild(mk("Moisture area","MA","#2f78c9","area"));
  nav.appendChild(eb("Penetrations & drains"));
  ORDER.forEach(code=>nav.appendChild(mk(TYPES[code].name,code,TYPES[code].color)));
}
function setTool(t){
  tool=t; lineStart=null; cancelDraft();
  document.querySelectorAll(".tool").forEach(el=>el.classList.toggle("active",el.dataset.tool===t));
  drawbar.hidden = !(t==="W"||t==="MA");
  modeSeg.style.display = (t==="W")?"":"none";
  if(t==="W") showHint(wallMode==="line"?"Tap one end of the wall, then the other":"Tap along the wall, then Finish");
  else if(t==="MA") showHint("Tap around the wet area, then Finish to close it");
  else if(t==="FC") showHint("Tap the two ends of a measurement to verify Google Earth");
  else if(t!=="select") showHint("Tap the roof to drop a "+TYPES[t].name.toLowerCase());
  else hideHint();
  render();
}
let hintTimer=null;
function showHint(txt,sticky){ hintEl.textContent=txt; hintEl.classList.add("show"); clearTimeout(hintTimer);
  if(!sticky) hintTimer=setTimeout(()=>hintEl.classList.remove("show"),2800); }
function hideHint(){ hintEl.classList.remove("show"); }

modeSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  wallMode=b.dataset.mode; lineStart=null; cancelDraft();
  document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.toggle("on",x===b));
  showHint(wallMode==="line"?"Tap one end of the wall, then the other":"Tap along the wall, then Finish"); render(); });
document.getElementById("undoPt").onclick=()=>{ draft.pts.pop(); if(!draft.pts.length){cancelDraft();} render(); };
document.getElementById("cancelPath").onclick=()=>{ cancelDraft(); render(); };
document.getElementById("finishPath").onclick=finishPath;
function showPathCtrl(){ pathctrl.hidden=false; }
function cancelDraft(){ draft={pts:[]}; draftKind=null; pathctrl.hidden=true; }
function finishPath(){
  if(draftKind==="MA"){ if(draft.pts.length>=3) commitPoly("MA",draft.pts.slice()); }
  else { if(draft.pts.length>=2) commitLine("W",draft.pts.slice()); }
  cancelDraft(); render();
}

/* ---------- transforms / sizing ---------- */
function toImg(sx,sy){ return {x:(sx-view.tx)/view.scale, y:(sy-view.ty)/view.scale}; }
function toScreen(ix,iy){ return {x:ix*view.scale+view.tx, y:iy*view.scale+view.ty}; }
function fitView(){ if(!state.img) return; const r=stage.getBoundingClientRect(), pad=40;
  const s=Math.min((r.width-pad)/state.imgW,(r.height-pad)/state.imgH);
  view.scale=s; view.tx=(r.width-state.imgW*s)/2; view.ty=(r.height-state.imgH*s)/2; render(); }
function zoomAt(cx,cy,f){ const b=toImg(cx,cy); view.scale=Math.max(0.05,Math.min(12,view.scale*f));
  view.tx=cx-b.x*view.scale; view.ty=cy-b.y*view.scale; render(); }
function resize(){ const r=stage.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr; canvas.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); render(); }
window.addEventListener("resize",resize);

/* ---------- geometry ---------- */
function centroid(pts){ let x=0,y=0; pts.forEach(p=>{x+=p.x;y+=p.y;}); return {x:x/pts.length,y:y/pts.length}; }
function distToSeg(px,py,x1,y1,x2,y2){ const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy)); }
function distToPolyline(px,py,pts,closed){ let m=Infinity, n=pts.length;
  for(let i=0;i<n-1;i++){ const a=toScreen(pts[i].x,pts[i].y), b=toScreen(pts[i+1].x,pts[i+1].y); m=Math.min(m,distToSeg(px,py,a.x,a.y,b.x,b.y)); }
  if(closed&&n>2){ const a=toScreen(pts[n-1].x,pts[n-1].y), b=toScreen(pts[0].x,pts[0].y); m=Math.min(m,distToSeg(px,py,a.x,a.y,b.x,b.y)); }
  return m; }
function pointInPoly(sx,sy,pts){ let inside=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){
  const a=toScreen(pts[i].x,pts[i].y), b=toScreen(pts[j].x,pts[j].y);
  if(((a.y>sy)!=(b.y>sy)) && (sx < (b.x-a.x)*(sy-a.y)/(b.y-a.y)+a.x)) inside=!inside; } return inside; }

/* ---------- render ---------- */
function render(target,fullres){
  const c=target||ctx;
  const W=fullres?state.imgW:canvas.width/(window.devicePixelRatio||1);
  const H=fullres?state.imgH:canvas.height/(window.devicePixelRatio||1);
  c.clearRect(0,0,W,H); if(!state.img) return;
  if(fullres){ c.drawImage(state.img,0,0); }
  else{ c.save(); c.translate(view.tx,view.ty); c.scale(view.scale,view.scale); c.drawImage(state.img,0,0); c.restore(); }
  const P=fullres?(x,y)=>({x,y}):(x,y)=>toScreen(x,y);
  const lineW=fullres?4:3, dot=fullres?Math.max(13,state.imgW/90):13;

  // moisture areas (under everything)
  state.items.filter(i=>i.kind==="MA").forEach(it=>{
    const pts=it.pts, sel=it.id===selectedId;
    c.beginPath(); pts.forEach((p,i)=>{const s=P(p.x,p.y); i?c.lineTo(s.x,s.y):c.moveTo(s.x,s.y);}); c.closePath();
    c.fillStyle="rgba(47,120,201,0.30)"; c.fill(); c.strokeStyle="#2f78c9"; c.lineWidth=lineW; c.stroke();
    if(sel) pts.forEach(p=>{const s=P(p.x,p.y); c.beginPath(); c.arc(s.x,s.y,lineW+3,0,7); c.fillStyle="#fff"; c.fill(); c.lineWidth=2; c.strokeStyle="#2f78c9"; c.stroke();});
    const mid=P(centroid(pts).x,centroid(pts).y); labelBadge(c,mid.x,mid.y,it.label+"  "+lineLabel(it),"#2f78c9",fullres);
  });
  // wall / edge / field-check lines
  state.items.filter(i=>i.kind==="W"||i.kind==="FC").forEach(it=>{
    const col=itemColor(it), pts=it.pts, sel=it.id===selectedId;
    c.strokeStyle=col; c.lineWidth=lineW+(it.kind==="FC"?0:1); c.lineCap="round"; c.lineJoin="round";
    if(it.kind==="FC") c.setLineDash([fullres?14:9, fullres?9:6]); else c.setLineDash([]);
    c.beginPath(); pts.forEach((p,i)=>{const s=P(p.x,p.y); i?c.lineTo(s.x,s.y):c.moveTo(s.x,s.y);}); c.stroke(); c.setLineDash([]);
    pts.forEach(p=>{const s=P(p.x,p.y); c.beginPath(); c.arc(s.x,s.y,(sel?lineW+3:lineW+1),0,7);
      c.fillStyle=sel?"#fff":col; c.fill(); if(sel){c.lineWidth=2;c.strokeStyle=col;c.stroke();}});
    const mid=P(centroid(pts).x,centroid(pts).y); labelBadge(c,mid.x,mid.y,it.label+"  "+lineLabel(it),col,fullres);
  });
  // point items (top)
  state.items.filter(i=>i.kind!=="W"&&i.kind!=="FC"&&i.kind!=="MA").forEach(it=>{
    const p=P(it.x,it.y), t=TYPES[it.kind], sel=it.id===selectedId;
    c.beginPath(); c.arc(p.x,p.y,dot,0,7); c.fillStyle=t.color; c.fill();
    c.lineWidth=sel?3:2; c.strokeStyle=sel?"#12233b":"#fff"; c.stroke();
    c.fillStyle="#fff"; c.font=`700 ${Math.round(dot*0.8)}px ui-monospace,monospace`;
    c.textAlign="center"; c.textBaseline="middle"; c.fillText(it.label,p.x,p.y+0.5);
  });
  // pending
  if(!fullres){
    if(lineStart){ const s=toScreen(lineStart.x,lineStart.y); c.fillStyle=tool==="FC"?"#d23b3b":"#e4650d"; c.beginPath(); c.arc(s.x,s.y,5,0,7); c.fill(); }
    if(draft.pts.length){ const col=draftKind==="MA"?"#2f78c9":"#e4650d"; c.strokeStyle=col; c.setLineDash([6,5]); c.lineWidth=3; c.lineCap="round";
      c.beginPath(); draft.pts.forEach((p,i)=>{const s=toScreen(p.x,p.y); i?c.lineTo(s.x,s.y):c.moveTo(s.x,s.y);}); c.stroke(); c.setLineDash([]);
      draft.pts.forEach(p=>{const s=toScreen(p.x,p.y); c.fillStyle=col; c.beginPath(); c.arc(s.x,s.y,5,0,7); c.fill();}); }
  }
}
function lineLabel(it){ const a=it.attrs;
  if(it.kind==="FC") return a.field||"?";
  if(it.kind==="MA"){ const A=areaFtOf(it); return A!=null?(Math.round(A).toLocaleString()+" sf"):"moisture"; }
  const L=lenFtOf(it); if(L!=null) return round1(L)+"'";
  if(a.runtype==="Roof edge") return "edge";
  if(a.tapered){ const v=avgStr(a.ht1,a.ht2); return v==="—"?"tapered":("~"+v); }
  return a.ht||""; }
function labelBadge(c,x,y,text,color,fullres){
  const fs=fullres?Math.max(12,state.imgW/110):11;
  c.font=`700 ${fs}px ui-monospace,monospace`; c.textAlign="left"; c.textBaseline="middle";
  const w=c.measureText(text).width+10,h=fs+8;
  c.fillStyle=color; roundRect(c,x-w/2,y-h/2,w,h,4); c.fill();
  c.fillStyle="#fff"; c.fillText(text,x-w/2+5,y+0.5); }
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ---------- hit / grab ---------- */
function hitTest(sx,sy){
  const pts=state.items.filter(i=>i.kind!=="W"&&i.kind!=="FC"&&i.kind!=="MA");
  for(let i=pts.length-1;i>=0;i--){ const p=toScreen(pts[i].x,pts[i].y); if(Math.hypot(p.x-sx,p.y-sy)<=15) return pts[i]; }
  const lines=state.items.filter(i=>i.kind==="W"||i.kind==="FC"||i.kind==="MA");
  for(let i=lines.length-1;i>=0;i--){ const it=lines[i], closed=it.kind==="MA";
    if(distToPolyline(sx,sy,it.pts,closed)<=(closed?8:10)) return it;
    if(closed&&pointInPoly(sx,sy,it.pts)) return it; }
  return null;
}
function grabTest(sx,sy){
  const pts=state.items.filter(i=>i.kind!=="W"&&i.kind!=="FC"&&i.kind!=="MA");
  for(let i=pts.length-1;i>=0;i--){ const p=toScreen(pts[i].x,pts[i].y); if(Math.hypot(p.x-sx,p.y-sy)<=15) return {item:pts[i],type:"point"}; }
  const sel=state.items.find(i=>i.id===selectedId);
  if(sel&&sel.pts){ const closed=sel.kind==="MA";
    for(let v=0;v<sel.pts.length;v++){ const p=toScreen(sel.pts[v].x,sel.pts[v].y); if(Math.hypot(p.x-sx,p.y-sy)<=15) return {item:sel,type:"vertex",vi:v}; }
    if(distToPolyline(sx,sy,sel.pts,closed)<=10 || (closed&&pointInPoly(sx,sy,sel.pts))) return {item:sel,type:"line"}; }
  return null;
}

/* ---------- pointer input ---------- */
const pointers=new Map();
let panLast=null, downPt=null, moved=false, pinchLast=null, dragTarget=null, dragLast=null;
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const rect=stage.getBoundingClientRect(); const sx=e.clientX-rect.left, sy=e.clientY-rect.top;
  downPt={x:sx,y:sy}; moved=false;
  if(pointers.size===1){ dragTarget=null; panLast=null;
    if(tool==="select"&&state.img){ const g=grabTest(sx,sy); if(g){dragTarget=g; dragLast={x:e.clientX,y:e.clientY}; return;} }
    panLast={x:e.clientX,y:e.clientY};
  } else if(pointers.size===2){ panLast=null; dragTarget=null; pinchLast=pinchState(); }
});
canvas.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(dragTarget){
    const dx=(e.clientX-dragLast.x)/view.scale, dy=(e.clientY-dragLast.y)/view.scale;
    if(Math.abs(e.clientX-dragLast.x)+Math.abs(e.clientY-dragLast.y)>2) moved=true;
    const it=dragTarget.item;
    if(dragTarget.type==="point"){ it.x+=dx; it.y+=dy; }
    else if(dragTarget.type==="vertex"){ it.pts[dragTarget.vi].x+=dx; it.pts[dragTarget.vi].y+=dy; }
    else if(dragTarget.type==="line"){ it.pts.forEach(p=>{p.x+=dx;p.y+=dy;}); }
    dragLast={x:e.clientX,y:e.clientY}; render(); return; }
  if(pointers.size===2){ const ps=pinchState();
    if(pinchLast){ const f=ps.dist/pinchLast.dist; const rect=stage.getBoundingClientRect();
      zoomAt(ps.mid.x-rect.left,ps.mid.y-rect.top,f); view.tx+=ps.mid.x-pinchLast.mid.x; view.ty+=ps.mid.y-pinchLast.mid.y; render(); }
    pinchLast=ps; moved=true; return; }
  if(panLast){ const dx=e.clientX-panLast.x, dy=e.clientY-panLast.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    view.tx+=dx; view.ty+=dy; panLast={x:e.clientX,y:e.clientY}; render(); }
});
function endPointer(e){
  const wasSingle=pointers.size===1; pointers.delete(e.pointerId); if(pointers.size<2) pinchLast=null;
  if(pointers.size===0){
    if(dragTarget){ if(!moved) openEditor(dragTarget.item.id); else refresh(); dragTarget=null; }
    else if(wasSingle && !moved && downPt){ handleTap(downPt.x,downPt.y); }
    panLast=null; downPt=null; moved=false;
  } else { const p=[...pointers.values()][0]; if(p) panLast={x:p.x,y:p.y}; }
}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);panLast=null;pinchLast=null;dragTarget=null;});
function pinchState(){ const p=[...pointers.values()]; return {dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),mid:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}}; }
canvas.addEventListener("wheel",e=>{ e.preventDefault(); const r=stage.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:0.89); },{passive:false});

function handleTap(sx,sy){
  if(!state.img) return;
  if(tool==="select"){ const hit=hitTest(sx,sy); if(hit) openEditor(hit.id); else closeEditor(); return; }
  const ip=toImg(sx,sy);
  if(tool==="W"){
    if(wallMode==="line"){ if(!lineStart){ lineStart={x:ip.x,y:ip.y}; showHint("Now tap the other end",true); render(); }
      else{ commitLine("W",[lineStart,{x:ip.x,y:ip.y}]); lineStart=null; } }
    else { draft.pts.push({x:ip.x,y:ip.y}); draftKind="W"; showPathCtrl(); render(); }
    return; }
  if(tool==="MA"){ draft.pts.push({x:ip.x,y:ip.y}); draftKind="MA"; showPathCtrl(); render(); return; }
  if(tool==="FC"){ if(!lineStart){ lineStart={x:ip.x,y:ip.y}; showHint("Now tap the other end of the measurement",true); render(); }
    else{ commitLine("FC",[lineStart,{x:ip.x,y:ip.y}]); lineStart=null; } return; }
  const it=makeItem(tool); it.x=ip.x; it.y=ip.y; state.items.push(it); openEditor(it.id); refresh();
}
function commitLine(kind,pts){ const it=makeItem(kind); it.pts=pts; state.items.push(it); hideHint(); openEditor(it.id); refresh(); }
function commitPoly(kind,pts){ const it=makeItem(kind); it.pts=pts; it.closed=true; state.items.push(it); hideHint(); openEditor(it.id); refresh(); }
function makeItem(kind){ return {id:"i"+(seq++), kind, label:nextLabel(kind), attrs:defaults(kind)}; }
function defaults(kind){ const o={}; TYPES[kind].fields.forEach(f=>{ if(f.def!==undefined) o[f.k]=f.def; }); return o; }
function nextLabel(kind){ const n=state.items.filter(i=>i.kind===kind).length+1; return TYPES[kind].code+n; }
function relabel(){ const c={}; state.items.forEach(it=>{ c[it.kind]=(c[it.kind]||0)+1; it.label=TYPES[it.kind].code+c[it.kind]; }); }

/* ---------- editor ---------- */
function openEditor(id){
  const it=state.items.find(i=>i.id===id); if(!it) return;
  selectedId=id; const t=TYPES[it.kind];
  document.getElementById("edChip").style.background=itemColor(it);
  document.getElementById("edChip").textContent=it.label;
  document.getElementById("edTitle").textContent=t.name;
  const body=document.getElementById("edBody"); body.innerHTML="";
  const shown=t.fields.filter(f=>!f.when||f.when(it.attrs));
  for(let i=0;i<shown.length;i++){ const f=shown[i], next=shown[i+1];
    if(next&&f.type==="text"&&next.type==="text"&&isPair(f.k,next.k)){
      const wrap=document.createElement("div"); wrap.className="dbl";
      wrap.appendChild(fieldEl(it,f)); wrap.appendChild(fieldEl(it,next)); body.appendChild(wrap); i++;
    } else body.appendChild(fieldEl(it,f)); }
  editor.classList.add("open"); render();
}
function fieldEl(it,f){
  const w=document.createElement("div"); w.className="fld";
  if(f.type==="checkbox"){ w.className="fld check";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!it.attrs[f.k]; cb.id="cb_"+f.k;
    const lab=document.createElement("label"); lab.setAttribute("for",cb.id); lab.textContent=f.label;
    cb.onchange=()=>{ it.attrs[f.k]=cb.checked; openEditor(it.id); refresh(); };
    w.appendChild(cb); w.appendChild(lab); return w; }
  const lab=document.createElement("label"); lab.textContent=f.label; w.appendChild(lab);
  if(f.type==="computed"){ const d=document.createElement("div"); d.className="computed"; d.dataset.compute=f.k; d.textContent=f.compute(it.attrs,it); w.appendChild(d); return w; }
  let inp;
  if(f.type==="select"){ inp=document.createElement("select");
    f.opts.forEach(o=>{const op=document.createElement("option");op.value=o;op.textContent=o;inp.appendChild(op);});
    inp.value=it.attrs[f.k]||f.def||f.opts[0]; }
  else if(f.type==="textarea"){ inp=document.createElement("textarea"); inp.value=it.attrs[f.k]||""; }
  else { inp=document.createElement("input"); inp.type="text"; inp.value=it.attrs[f.k]||""; if(f.ph)inp.placeholder=f.ph; }
  const handler=()=>{ it.attrs[f.k]=inp.value; if(f.controls) openEditor(it.id); else syncComputed(it); refresh(); };
  inp.oninput=handler; if(f.type==="select") inp.onchange=handler;
  w.appendChild(inp); return w;
}
function syncComputed(it){ document.querySelectorAll("#edBody [data-compute]").forEach(el=>{
  const f=TYPES[it.kind].fields.find(x=>x.k===el.dataset.compute); if(f&&f.compute) el.textContent=f.compute(it.attrs,it); }); }
function closeEditor(){ editor.classList.remove("open"); selectedId=null; render(); }
document.getElementById("edClose").onclick=closeEditor;
document.getElementById("edDone").onclick=closeEditor;
document.getElementById("edDelete").onclick=()=>{ state.items=state.items.filter(i=>i.id!==selectedId); relabel(); closeEditor(); refresh(); };

/* ---------- summary ---------- */
function buildSummary(){
  const s=document.getElementById("summary"), total=state.items.length;
  let html=`<h3>Take-off summary</h3><div class="sub">${total} item${total!==1?"s":""} placed · tap a row to locate</div>`;
  const walls=state.items.filter(i=>i.kind==="W");
  if(walls.length){ html+=`<div class="grp"><div class="grp-h">Walls &amp; edges<span class="n">${walls.length}</span></div>`+walls.map(it=>rowHtml(it,wallDesc(it))).join("")+`</div>`; }
  ORDER.forEach(code=>{ const items=state.items.filter(i=>i.kind===code); if(!items.length) return;
    html+=`<div class="grp"><div class="grp-h"><span class="chip" style="background:${TYPES[code].color};width:14px;height:14px;font-size:0"></span>${TYPES[code].name}<span class="n">${items.length}</span></div>`+items.map(it=>rowHtml(it,descFor(it))).join("")+`</div>`; });
  const mas=state.items.filter(i=>i.kind==="MA");
  if(mas.length){ html+=`<div class="grp"><div class="grp-h"><span class="chip area" style="width:14px;height:11px"></span>Inter-ply moisture<span class="n">${mas.length}</span></div>`+mas.map(it=>rowHtml(it,maDesc(it))).join("")+`</div>`; }
  const fcs=state.items.filter(i=>i.kind==="FC");
  if(fcs.length){ html+=`<div class="grp"><div class="grp-h"><span class="chip line" style="background:#d23b3b;font-size:0"></span>Field checks<span class="n">${fcs.length}</span></div>`+fcs.map(it=>rowHtml(it,fcDesc(it))).join("")+`</div>`; }
  if(!total) html+=`<div class="none">Nothing placed yet. Pick a tool on the left and tap the roof.</div>`;
  if(total){ const drains=state.items.filter(i=>i.kind==="RD").length,
      pens=state.items.filter(i=>["PB","SB","VO","PP"].includes(i.kind)).length,
      curbs=state.items.filter(i=>i.kind==="CB").length, sc=computeScale();
    let line=`<b>${drains}</b> drains · <b>${pens}</b> penetrations · <b>${curbs}</b> curbs · <b>${walls.length}</b> wall runs`;
    if(sc){ const wet=mas.reduce((s,it)=>{const A=areaFtOf(it); return s+(A||0);},0);
      if(wet>0) line+=` · <b>${Math.round(wet).toLocaleString()}</b> sf wet`;
      line+=`<br><span style="font-size:11px">scale set from ${sc.count} field check${sc.count!==1?"s":""}</span>`; }
    else if(walls.length||mas.length){ line+=`<br><span style="font-size:11px">draw a field check to auto-measure lengths &amp; areas</span>`; }
    html+=`<div class="totals">${line}</div>`; }
  const flagged=fcs.filter(it=>{const p=variancePct(it.attrs.field,it.attrs.ge); return p!=null&&p>VAR_THRESHOLD;});
  if(flagged.length){ const worst=Math.max(...flagged.map(it=>variancePct(it.attrs.field,it.attrs.ge)));
    html+=`<div class="aerial">⚠ Field checks differ from Google Earth by up to ${Math.round(worst*10)/10}% — worth ordering an aerial measurement before you price this one.</div>`; }
  s.innerHTML=html; s.querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>locate(r.dataset.id));
}
function rowHtml(it,desc){ return `<div class="row" data-id="${it.id}"><span class="tag" style="background:${itemColor(it)}">${it.label}</span><span class="desc">${desc}</span></div>`; }
function wallDesc(it){ const a=it.attrs, L=lenFtOf(it), lenBit=L!=null?` <em>· ${round1(L)} ft</em>`:"";
  if(a.runtype==="Roof edge"){ return `Roof edge · ${esc(a.edge||"—")}${a.edgeFace?` <em>· face ${esc(a.edgeFace)}</em>`:""}${lenBit}`; }
  const h=a.tapered?`~${esc(avgStr(a.ht1,a.ht2))} avg`:esc(a.ht||"—");
  const bits=[`Parapet · ${h}`]; if(a.width) bits.push(`<em>· ${esc(a.width)} wide</em>`); bits.push(`<em>· ${esc(a.cap||"")} cap</em>`);
  return bits.join(" ")+lenBit; }
function maDesc(it){ const a=it.attrs, A=areaFtOf(it);
  return `${esc(a.status||"")} <em>· ${esc(a.method||"")}</em>${A!=null?` <em>· ${Math.round(A).toLocaleString()} sf</em>`:""}`; }
function fcDesc(it){ const a=it.attrs, p=variancePct(a.field,a.ge);
  const flag=p==null?"":(p>VAR_THRESHOLD?` <span class="flag">⚠ ${varianceStr(a.field,a.ge)}</span>`:` <em>· ${varianceStr(a.field,a.ge)}</em>`);
  return `${esc(a.where||"measurement")} — field ${esc(a.field||"?")} vs GE ${esc(a.ge||"?")}${flag}`; }
function descFor(it){ const a=it.attrs; switch(it.kind){
  case "RD": return `${a.size==="Other"?esc(a.sizeOther||"Other"):esc(a.size||"—")} <em>${esc(a.kind||"")}</em>`;
  case "SC": return `${esc(a.w||"?")}×${esc(a.h||"?")} <em>${esc(a.kind||"")}</em>`;
  case "PB": case "SB": return `${esc(a.dia||"—")} pipe${a.reason?` <em>· ${esc(a.reason)}</em>`:""}`;
  case "CB": return `${esc(a.l||"?")}×${esc(a.w||"?")}${a.ht?`, ${esc(a.ht)} tall`:""} <em>${esc(a.equip||"")}</em>`;
  case "PP": return `${esc(a.pens||"?")} pens${a.size?`, ${esc(a.size)}`:""}`;
  case "SK": return `${esc(a.l||"?")}×${esc(a.w||"?")}`;
  case "RH": return `${esc(a.size||"—")}`;
  case "VO": return `${esc(a.desc||"—")}`; default: return ""; } }
function locate(id){ const it=state.items.find(i=>i.id===id); if(!it) return;
  const ct=it.pts?centroid(it.pts):{x:it.x,y:it.y}; const r=stage.getBoundingClientRect();
  view.tx=r.width/2-ct.x*view.scale; view.ty=r.height/2-ct.y*view.scale; render(); openEditor(id);
  if(window.innerWidth<=820) document.getElementById("summary").classList.remove("open"); }
function refresh(doRender=true){ if(doRender) render(); buildSummary(); }

/* ---------- image ---------- */
function loadImageFile(file){ const rd=new FileReader(); rd.onload=()=>setImage(rd.result); rd.readAsDataURL(file); }
function setImage(url){ const im=new Image(); im.onload=()=>{ state.img=im; state.imgW=im.naturalWidth; state.imgH=im.naturalHeight;
  state.imgData=url; document.getElementById("empty").style.display="none"; fitView(); refresh(); }; im.src=url; }
document.getElementById("addImg").onclick=()=>document.getElementById("imgInput").click();
document.getElementById("imgInput").onchange=e=>{ if(e.target.files[0]) loadImageFile(e.target.files[0]); e.target.value=""; };

/* ---------- save / load ---------- */
document.getElementById("saveBtn").onclick=()=>{
  const data={v:3,job:val("job"),opp:val("opp"),inspector:val("insp"),date:val("date"),imgW:state.imgW,imgH:state.imgH,image:state.imgData,items:state.items};
  download(JSON.stringify(data),fname()+".json","application/json"); showHint("Saved"); };
document.getElementById("loadBtn").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("openHere").onclick=e=>{e.preventDefault();document.getElementById("fileInput").click();};
document.getElementById("fileInput").onchange=e=>{ const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ loadData(JSON.parse(rd.result)); }catch(err){ showHint("Couldn't read that file"); } }; rd.readAsText(f); e.target.value=""; };
function loadData(d){ setVal("job",d.job); setVal("opp",d.opp); setVal("insp",d.inspector); setVal("date",d.date);
  state.items=(d.items||[]).map(migrate);
  seq=state.items.reduce((m,i)=>Math.max(m,parseInt((i.id||"i0").slice(1))||0),0)+1;
  if(d.image) setImage(d.image); else { document.getElementById("empty").style.display="none"; refresh(); } }
function migrate(it){ if((it.kind==="W"||it.kind==="FC")&&!it.pts&&it.x1!==undefined){ it.pts=[{x:it.x1,y:it.y1},{x:it.x2,y:it.y2}]; delete it.x1;delete it.y1;delete it.x2;delete it.y2; } return it; }
function val(id){return document.getElementById(id).value;}
function setVal(id,v){document.getElementById(id).value=v||"";}
function fname(){ return (val("opp")?val("opp")+"_":"")+(val("job")||"roof-takeoff").replace(/[^\w-]+/g,"_"); }
function download(text,name,type){ const b=new Blob([text],{type}),u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }

/* ---------- export ---------- */
document.getElementById("exportBtn").onclick=()=>{
  if(state.img){ const off=document.createElement("canvas"); off.width=state.imgW; off.height=state.imgH; render(off.getContext("2d"),true);
    off.toBlob(b=>{ const u=URL.createObjectURL(b),a=document.createElement("a"); a.href=u; a.download=fname()+"_annotated.png"; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }); }
  const rows=[["Job",val("job")],["Opportunity",val("opp")],["Inspector",val("insp")],["Date",val("date")],[],["Tag","Component","Measured","Attributes"]];
  state.items.forEach(it=>{ const a=it.attrs;
    let meas=""; if(it.kind==="W"){const L=lenFtOf(it); meas=L!=null?round1(L)+" ft":"";}
    else if(it.kind==="MA"){const A=areaFtOf(it); meas=A!=null?Math.round(A)+" sq ft":"";}
    const pairs=Object.keys(a).filter(k=>a[k]!==""&&a[k]!==undefined).map(k=>`${k}=${a[k]}`).join("; ");
    rows.push([it.label,TYPES[it.kind].name,meas,pairs]); });
  const csv=rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(",")).join("\n");
  download(csv,fname()+"_schedule.csv","text/csv"); showHint("Exported annotated image + schedule"); };

/* ---------- zoom / mobile ---------- */
document.getElementById("zin").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.2);};
document.getElementById("zout").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,0.83);};
document.getElementById("zfit").onclick=fitView;
document.getElementById("mSummary").onclick=()=>document.getElementById("summary").classList.toggle("open");

/* ---------- init ---------- */
document.getElementById("date").valueAsDate=new Date();
buildPalette(); buildSummary(); resize();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
